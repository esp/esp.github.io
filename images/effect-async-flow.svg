<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" font-family="sans-serif" font-size="14">
  <title>An effect fetches weather data through a service and publishes the result as a new event</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="760" height="520" fill="#fff"/>

  <g fill="#fff" stroke="#555" stroke-width="1.5">
    <rect x="30" y="20" width="140" height="40" rx="4"/>
    <rect x="220" y="20" width="140" height="40" rx="4"/>
    <rect x="410" y="20" width="140" height="40" rx="4"/>
    <rect x="600" y="20" width="140" height="40" rx="4"/>
  </g>
  <g fill="#333" text-anchor="middle">
    <text x="100" y="45">View</text>
    <text x="290" y="45">Event handlers</text>
    <text x="480" y="45">Effect</text>
    <text x="670" y="45">WeatherService</text>
  </g>

  <g stroke="#555" stroke-width="1" stroke-dasharray="4 4">
    <line x1="100" y1="60" x2="100" y2="500"/>
    <line x1="290" y1="60" x2="290" y2="500"/>
    <line x1="480" y1="60" x2="480" y2="500"/>
    <line x1="670" y1="60" x2="670" y2="500"/>
  </g>

  <g fill="#fff" stroke="#555" stroke-width="1.5">
    <rect x="210" y="128" width="160" height="30" rx="4"/>
    <rect x="200" y="408" width="180" height="48" rx="4"/>
  </g>

  <g fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="100" y1="100" x2="290" y2="100"/>
    <line x1="480" y1="190" x2="670" y2="190"/>
    <line x1="290" y1="250" x2="100" y2="250"/>
    <line x1="670" y1="320" x2="480" y2="320" stroke-dasharray="6 4"/>
    <line x1="480" y1="370" x2="290" y2="370"/>
    <line x1="290" y1="480" x2="100" y2="480"/>
  </g>

  <g fill="#333" text-anchor="middle">
    <text x="195" y="92">1. FetchWeather</text>
    <text x="290" y="148">2. isLoading = true</text>
    <text x="575" y="182">3. fetchWeather()</text>
    <text x="195" y="242">4. update: isLoading</text>
    <text x="575" y="312">5. promise resolves</text>
    <text x="385" y="362">6. FetchWeatherSuccess</text>
    <text x="290" y="428">7. data = result,</text>
    <text x="290" y="446">isLoading = false</text>
    <text x="195" y="472">8. update: data</text>
  </g>
</svg>
